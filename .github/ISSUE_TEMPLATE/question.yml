name: ❓ Question / Support
description: Ask a question about using or setting up V3 SSO WebUI
title: "[Question]: "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What do you want to know?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Anything else that might help us answer (setup, environment, what you've already tried).
    validations:
      required: false
